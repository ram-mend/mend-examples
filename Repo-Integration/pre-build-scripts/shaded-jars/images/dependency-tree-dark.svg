<svg xmlns="http://www.w3.org/2000/svg" width="900" height="508" viewBox="0 0 900 508" role="img" aria-labelledby="title desc">
  <title id="title">The regular sample's dependency tree, without and with the hook</title>
  <desc id="desc">Without the hook, demo-app has xstream 1.4.5 (with xmlpull 1.1.3.1 and xpp3_min 1.1.4c), jackson-core 2.22.3 and parquet-jackson 1.18.0, and parquet-jackson is a leaf. With the hook, the copies it declares are added: fastdoubleparser 2.0.1 under jackson-core 2.22.3; and under parquet-jackson, jackson-core 2.22.1 (with fastdoubleparser 2.0.1), jackson-annotations 2.22 and jackson-databind 2.22.1, which has jackson-annotations 2.22 and jackson-core 2.22.1 (with fastdoubleparser 2.0.1).</desc>
  <!-- README's figure: the regular sample's tree. In each panel, a node's parent is the latest node to the left of it. The light and dark files differ only in <style>. -->
  <style>
    .card { fill: #191e24; stroke: #343e48; }
    .divider, .branch { stroke: #343e48; stroke-width: 1.4; fill: none; }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; font-size: 12px; fill: #9ba6b2; }
    .heading { font-size: 14px; font-weight: 600; fill: #e3e8ed; }
    .node { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #e3e8ed; }
    .copy { fill: #f0a54e; font-weight: 600; }
    .bad { fill: #ef8b76; }
    .swatch { fill: #33240f; stroke: #f0a54e; stroke-width: 1.5; }
  </style>
  <rect class="card" x="0.5" y="0.5" width="899" height="507" rx="8"/>
  <g id="without">
    <text class="heading" x="32" y="40">Without the hook</text>
    <path class="branch" d="M40 90 V230 M40 110 H58 M40 200 H58 M40 230 H58 M72 120 V170 M72 140 H90 M72 170 H90"/>
    <text class="node" x="32" y="84">demo-app</text>
    <text class="node" x="64" y="114">xstream 1.4.5</text>
    <text class="node" x="96" y="144">xmlpull 1.1.3.1</text>
    <text class="node" x="96" y="174">xpp3_min 1.1.4c</text>
    <text class="node" x="64" y="204">jackson-core 2.22.3</text>
    <text class="node" x="64" y="234">parquet-jackson 1.18.0</text>
    <text class="bad" x="64" y="256">a leaf: the 3 Jackson libraries</text>
    <text class="bad" x="64" y="272">inside it aren't reported</text>
  </g>
  <line class="divider" x1="300" y1="20" x2="300" y2="488"/>
  <g id="with">
    <text class="heading" x="332" y="40">With the hook</text>
    <path class="branch" d="M340 90 V260 M340 110 H358 M340 200 H358 M340 260 H358 M372 120 V170 M372 140 H390 M372 170 H390 M372 210 V230 M372 230 H390 M372 270 V380 M372 290 H390 M372 350 H390 M372 380 H390 M404 300 V320 M404 320 H422 M404 390 V440 M404 410 H422 M404 440 H422 M436 450 V470 M436 470 H454"/>
    <text class="node" x="332" y="84">demo-app</text>
    <text class="node" x="364" y="114">xstream 1.4.5</text>
    <text class="node" x="396" y="144">xmlpull 1.1.3.1</text>
    <text class="node" x="396" y="174">xpp3_min 1.1.4c</text>
    <text class="node" x="364" y="204">jackson-core 2.22.3</text>
    <text class="node copy" x="396" y="234">fastdoubleparser 2.0.1</text>
    <text class="node" x="364" y="264">parquet-jackson 1.18.0</text>
    <text class="node copy" x="396" y="294">jackson-core 2.22.1</text>
    <text class="node copy" x="428" y="324">fastdoubleparser 2.0.1</text>
    <text class="node copy" x="396" y="354">jackson-annotations 2.22</text>
    <text class="node copy" x="396" y="384">jackson-databind 2.22.1</text>
    <text class="node copy" x="428" y="414">jackson-annotations 2.22</text>
    <text class="node copy" x="428" y="444">jackson-core 2.22.1</text>
    <text class="node copy" x="460" y="474">fastdoubleparser 2.0.1</text>
  </g>
  <g id="legend">
    <rect class="swatch" x="690" y="71" width="14" height="14" rx="3"/>
    <text x="712" y="83">a copy the hook declares</text>
    <text x="690" y="114">Each copy has the published</text>
    <text x="690" y="130">jar's exact bytes, so Mend</text>
    <text x="690" y="146">matches it by SHA-1 and</text>
    <text x="690" y="162">reports the published library</text>
    <text x="690" y="178">under its parent.</text>
  </g>
</svg>
